<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Bé Vui Học – Game cho bé 4 tuổi</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
html,body{margin:0;height:100%;touch-action:manipulation}
body{font-family:"Baloo 2","Nunito",system-ui,-apple-system,"Segoe UI",sans-serif;background:linear-gradient(180deg,#fff3d6 0%,#ffe0ec 55%,#dff3ff 100%);color:#4a3b2a;overflow-x:hidden}
#app{min-height:100dvh;display:flex;flex-direction:column;max-width:900px;margin:0 auto;padding:12px 14px calc(14px + env(safe-area-inset-bottom))}
button{font-family:inherit;cursor:pointer;border:0}
.splash{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;text-align:center}
.splash .bear{font-size:clamp(110px,34vw,200px);animation:bob 2s ease-in-out infinite}
.splash h1{margin:0;font-size:clamp(34px,9vw,56px);color:#e4572e;line-height:1.1}
.start{font-size:clamp(28px,8vw,42px);font-weight:800;color:#fff;background:#43a047;padding:18px 44px;border-radius:999px;box-shadow:0 8px 0 #2e7d32;animation:pulse 1.6s infinite}
.start:active{transform:translateY(6px);box-shadow:0 2px 0 #2e7d32}
.bar{display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:56px}
.title{font-size:clamp(26px,7vw,40px);font-weight:800;color:#e4572e}
.chip{font-size:22px;font-weight:700;background:#fff;border-radius:999px;padding:6px 16px;box-shadow:0 3px 0 #f0d9b5}
.ib{width:56px;height:56px;border-radius:50%;background:#fff;font-size:28px;box-shadow:0 4px 0 #f0d9b5}
.ib:active{transform:translateY(3px);box-shadow:0 1px 0 #f0d9b5}
.menu{flex:1;display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:10px;align-content:center}
.mb{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;color:#fff;border-radius:28px;padding:14px 8px;min-height:clamp(120px,22vh,190px);box-shadow:0 8px 0 rgba(0,0,0,.18);font-weight:800}
.mb:active{transform:translateY(6px);box-shadow:0 2px 0 rgba(0,0,0,.18)}
.mb .e{font-size:clamp(52px,15vw,86px);line-height:1.1}
.mb .t{font-size:clamp(22px,6vw,32px);text-shadow:0 2px 0 rgba(0,0,0,.18);text-align:center;line-height:1.1}
.top{display:flex;align-items:center;justify-content:space-between;gap:8px}
.dots{display:flex;gap:10px}
.d{width:20px;height:20px;border-radius:50%;background:#fff;box-shadow:inset 0 0 0 3px #f3d9a8}
.d.done{background:#ffb300;box-shadow:none}
.d.cur{background:#fff;box-shadow:0 0 0 4px #ff7043}
.stage{flex:1;min-height:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:6px;padding:6px 4px}
.bigemoji{font-size:clamp(100px,34vw,200px);line-height:1.05;animation:pop .5s}
.num-big{font-size:clamp(110px,38vw,210px);font-weight:800;color:#e4572e;line-height:1;animation:pop .5s}
.scene{animation:pop .5s}
.scene svg{display:block;width:min(82vw,400px);height:auto;max-height:40vh}
.cap{font-size:clamp(24px,6.6vw,38px);font-weight:700;color:#5d4630;line-height:1.2;padding:0 6px}
.cap b{color:#e4572e}
.items{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;max-width:560px}
.it{position:relative;background:#fff;border-radius:22px;font-size:clamp(50px,15vw,84px);width:clamp(84px,24vw,120px);height:clamp(84px,24vw,120px);display:flex;align-items:center;justify-content:center;box-shadow:0 5px 0 #f0d9b5}
.it.counted{background:#fff7d6;transform:scale(.94)}
.it b{position:absolute;right:-6px;top:-8px;background:#e4572e;color:#fff;border-radius:50%;width:38px;height:38px;font-size:24px;display:flex;align-items:center;justify-content:center;animation:pop .3s}
.opts{display:grid;gap:12px;margin-top:8px}
.opts.g3{grid-template-columns:repeat(3,1fr)}
.opts.g2{grid-template-columns:1fr 1fr}
.opt{background:#fff;border-radius:26px;box-shadow:0 7px 0 #e8cf9f;min-height:clamp(104px,20vh,170px);display:flex;align-items:center;justify-content:center;flex-direction:column;font-size:clamp(54px,16vw,100px);font-weight:800;color:#e4572e;line-height:1.05;transition:transform .15s}
.opt:active{transform:translateY(5px);box-shadow:0 2px 0 #e8cf9f}
.opt small{font-size:.5em;color:#8a6d4b}
.opt .dot{width:clamp(70px,22vw,120px);height:clamp(70px,22vw,120px);border-radius:50%;box-shadow:inset 0 -8px 0 rgba(0,0,0,.12),0 3px 0 rgba(0,0,0,.1)}
.grp{display:flex;flex-wrap:wrap;gap:2px;justify-content:center;font-size:clamp(20px,6vw,32px);line-height:1.1;padding:6px;font-weight:400}
.opt.yes{background:#c8f0cf;box-shadow:0 7px 0 #7cc78a;font-size:clamp(28px,8vw,48px);color:#1b6b2a}
.opt.no{background:#ffd3d0;box-shadow:0 7px 0 #e59a95;font-size:clamp(28px,8vw,48px);color:#a52a22}
.opt.yes span,.opt.no span{font-size:clamp(56px,17vw,96px);display:block}
.opt.right{background:#b9f0c2 !important;box-shadow:0 0 0 6px #43a047 !important;animation:pop .5s}
.opt.shake{animation:shake .4s}
.opt.dim{opacity:.35;pointer-events:none}
.opt.hint{animation:pulse 1s infinite;box-shadow:0 0 0 6px #ffb300}
.end{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;text-align:center}
.end .stars{font-size:clamp(40px,12vw,70px);letter-spacing:6px}
.end .big{font-size:clamp(90px,28vw,160px);animation:bob 1.6s ease-in-out infinite}
.row{display:flex;gap:14px;margin-top:10px;justify-content:center;min-height:80px}
.cta{font-size:clamp(34px,10vw,50px);color:#fff;padding:14px 30px;border-radius:26px;font-weight:800;box-shadow:0 7px 0 rgba(0,0,0,.2)}
.cta:active{transform:translateY(5px);box-shadow:0 2px 0 rgba(0,0,0,.2)}
.nb{background:#fff;border-radius:22px;aspect-ratio:1;font-size:clamp(34px,11vw,60px);font-weight:800;box-shadow:0 5px 0 #e8cf9f}
.nb:active{transform:translateY(4px);box-shadow:0 1px 0 #e8cf9f}
.wrap{position:relative;width:min(88vw,52vh,420px);aspect-ratio:1;margin:4px auto;background:#fff;border-radius:28px;box-shadow:0 7px 0 #e8cf9f;overflow:hidden}
.wrap canvas{position:absolute;left:0;top:0;width:100%;height:100%;touch-action:none}
.mb.wide{grid-column:1 / span 2}
.cdot{width:clamp(150px,50vw,260px);height:clamp(150px,50vw,260px);border-radius:50%;box-shadow:inset 0 -14px 0 rgba(0,0,0,.12),0 6px 0 rgba(0,0,0,.1);animation:pop .5s}
.enword{font-size:clamp(54px,18vw,100px);font-weight:800;color:#e4572e;line-height:1.1}
.shape svg{display:block;width:clamp(140px,46vw,240px);height:auto;animation:pop .5s}
.opt svg{display:block;width:clamp(64px,19vw,110px);height:auto}
.opts.g2 .opt svg{width:clamp(110px,36vw,170px)}
.opts.g2 .opt:has(svg){min-height:0;padding:6px}
.cf{position:fixed;top:-60px;font-size:34px;z-index:99;pointer-events:none;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(115vh) rotate(360deg)}}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-14px)}}
@keyframes pop{0%{transform:scale(.6)}70%{transform:scale(1.1)}100%{transform:scale(1)}}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-10px)}75%{transform:translateX(10px)}}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.05)}}
@media (min-width:700px) and (min-height:600px){#app{padding-top:24px}}
</style>
</head>
<body>
<div id="app"></div>
<script>
var S = {sound:true, total:0, mode:null, round:0, stars:0, wrong:0, locked:false, list:[], q:null, counted:0, token:0, wn:1, wdone:true, vi:false};
var app = document.getElementById('app');
var NUM = ['', 'một', 'hai', 'ba', 'bốn', 'năm', 'sáu', 'bảy', 'tám', 'chín', 'mười'];
var PRAISE = ['Giỏi quá!', 'Đúng rồi!', 'Tuyệt vời!', 'Con làm đúng rồi!', 'Hay quá!'];

function shuffle(a){ a = a.slice(); for (var i = a.length - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)); var t = a[i]; a[i] = a[j]; a[j] = t; } return a; }
function rnd(a){ return a[Math.floor(Math.random() * a.length)]; }

/* ---------- Âm thanh ---------- */
var ac = null;
function ctx(){
  try {
    if (!ac) ac = new (window.AudioContext || window.webkitAudioContext)();
    if (ac && ac.state === 'suspended') ac.resume();
  } catch (e) { ac = null; }
  return ac;
}
function tone(f, t0, d, type, v){
  var a = ctx(); if (!a || !S.sound) return;
  try {
    var o = a.createOscillator(), g = a.createGain(), t = a.currentTime + t0;
    o.type = type || 'sine'; o.frequency.value = f;
    g.gain.setValueAtTime(0.0001, t);
    g.gain.linearRampToValueAtTime(v || 0.18, t + 0.02);
    g.gain.exponentialRampToValueAtTime(0.0001, t + d);
    o.connect(g); g.connect(a.destination); o.start(t); o.stop(t + d + 0.05);
  } catch (e) {}
}
var sfx = {
  tap: function(){ tone(720, 0, 0.09, 'sine', 0.15); },
  good: function(){ [523, 659, 784, 1047].forEach(function(f, i){ tone(f, i * 0.09, 0.28); }); },
  bad: function(){ tone(320, 0, 0.18, 'triangle', 0.2); tone(250, 0.16, 0.28, 'triangle', 0.2); },
  win: function(){ [523, 659, 784, 659, 784, 1047, 1319].forEach(function(f, i){ tone(f, i * 0.12, 0.32); }); }
};

var voice = null, voiceEn = null;
function loadVoice(){
  try {
    if (!('speechSynthesis' in window)) return;
    var vs = speechSynthesis.getVoices();
    voice = null; voiceEn = null;
    for (var i = 0; i < vs.length; i++) {
      if (!voice && /^vi/i.test(vs[i].lang)) voice = vs[i];
      if (!voiceEn && /^en[-_]US/i.test(vs[i].lang)) voiceEn = vs[i];
    }
    if (!voiceEn) { for (var j = 0; j < vs.length; j++) { if (/^en/i.test(vs[j].lang)) { voiceEn = vs[j]; break; } } }
  } catch (e) {}
}
loadVoice();
try { if ('speechSynthesis' in window) speechSynthesis.onvoiceschanged = loadVoice; } catch (e) {}

function mkUtter(t, l){
  var u = new SpeechSynthesisUtterance(t);
  if (l === 'en') { u.lang = 'en-US'; if (voiceEn) u.voice = voiceEn; u.rate = 0.8; u.pitch = 1.1; }
  else { u.lang = 'vi-VN'; if (voice) u.voice = voice; u.rate = 0.82; u.pitch = 1.15; }
  return u;
}
function say(text, cb, lang){
  var list = (typeof text === 'string') ? [{t: text, l: lang || 'vi'}] : text;
  if (!S.sound || !('speechSynthesis' in window)) { if (cb) setTimeout(cb, 900); return; }
  try {
    speechSynthesis.cancel();
    window._us = [];
    list.forEach(function(it, i){
      var u = mkUtter(it.t, it.l);
      if (cb && i === list.length - 1) { u.onend = cb; u.onerror = cb; }
      window._us.push(u);
      speechSynthesis.speak(u);
    });
  } catch (e) { if (cb) setTimeout(cb, 900); }
}
function qSpeak(q){ say(q.sayList || q.say, null, q.en ? 'en' : 'vi'); }
function sayThen(text, cb){
  var done = false;
  function fn(){ if (!done) { done = true; cb(); } }
  say(text, function(){ setTimeout(fn, 600); });
  setTimeout(fn, 7500);
}
function stopSpeech(){ try { speechSynthesis.cancel(); } catch (e) {} }

function confetti(n){
  var em = ['⭐', '🎉', '✨', '🎈', '🌟'];
  for (var i = 0; i < (n || 22); i++) {
    var s = document.createElement('span');
    s.className = 'cf'; s.textContent = rnd(em);
    s.style.left = Math.random() * 100 + 'vw';
    s.style.animationDuration = (1.8 + Math.random() * 1.6) + 's';
    s.style.animationDelay = (Math.random() * 0.4) + 's';
    document.body.appendChild(s);
    (function(el){ setTimeout(function(){ if (el.parentNode) el.parentNode.removeChild(el); }, 4000); })(s);
  }
}

/* ---------- Hình vẽ minh họa (SVG) ---------- */
var C1 = '#37474f', C2 = '#ef6c00', C3 = '#1e88e5', C4 = '#d81b60';
function svgWrap(inner, bg){
  return '<svg viewBox="0 0 200 160" xmlns="http://www.w3.org/2000/svg"><rect width="200" height="160" rx="18" fill="' + (bg || '#e8f6ff') + '"/>' + inner + '</svg>';
}
function limb(p0, pts, w, c){
  var d = 'M' + p0[0] + ' ' + p0[1];
  for (var i = 0; i < pts.length; i++) d += ' L' + pts[i][0] + ' ' + pts[i][1];
  return '<path d="' + d + '" fill="none" stroke="' + c + '" stroke-width="' + w + '" stroke-linecap="round" stroke-linejoin="round"/>';
}
function kid(o){
  var c = o.c || C1, r = o.r || 10, h = o.h, hip = o.hip;
  var sh = o.sh || [h[0], h[1] + r + 3], lw = o.lw || 5.5, bw = o.bw || 8;
  var s = limb(sh, [hip], bw, c) + limb(sh, o.la || [], lw, c) + limb(sh, o.ra || [], lw, c) + limb(hip, o.ll || [], lw + 1, c) + limb(hip, o.rl || [], lw + 1, c);
  s += '<circle cx="' + h[0] + '" cy="' + h[1] + '" r="' + r + '" fill="' + c + '"/>';
  if (o.mouth) s += '<ellipse cx="' + (h[0] + 2) + '" cy="' + (h[1] + 3) + '" rx="4" ry="5.5" fill="#fff"/>';
  return s;
}
function stand(x, fy, c){
  return kid({c: c, r: 8, lw: 5, bw: 7, h: [x, fy - 50], hip: [x, fy - 26],
    la: [[x - 8, fy - 30], [x - 9, fy - 20]], ra: [[x + 8, fy - 30], [x + 9, fy - 20]],
    ll: [[x - 5, fy - 12], [x - 5, fy]], rl: [[x + 5, fy - 12], [x + 5, fy]]});
}
function waterLayer(y, op){
  return '<rect x="0" y="' + y + '" width="200" height="' + (160 - y) + '" fill="#4fc3f7" opacity="' + (op || 1) + '"/>' +
         '<path d="M0 ' + y + ' q12 -8 25 0 t25 0 t25 0 t25 0 t25 0 t25 0 t25 0 t25 0" fill="none" stroke="#fff" stroke-width="3" opacity=".85"/>';
}
function deckLayer(y, h, w){ return '<rect x="0" y="' + y + '" width="' + (w || 200) + '" height="' + h + '" fill="#ffe0b2"/>'; }
function stairsBase(){
  return '<polygon points="0,150 0,128 44,128 44,106 88,106 88,84 132,84 132,62 176,62 176,150" fill="#cfd8dc" stroke="#90a4ae" stroke-width="3"/>';
}
function slideBase(){
  return '<rect x="0" y="140" width="200" height="20" fill="#c5e1a5"/>' +
    '<g stroke="#8d6e63" stroke-width="4" stroke-linecap="round"><line x1="104" y1="76" x2="104" y2="140"/><line x1="128" y1="76" x2="128" y2="140"/><line x1="104" y1="92" x2="128" y2="92"/><line x1="104" y1="108" x2="128" y2="108"/><line x1="104" y1="124" x2="128" y2="124"/></g>' +
    '<rect x="92" y="70" width="46" height="7" rx="3" fill="#8d6e63"/>' +
    '<path d="M94 78 Q50 90 14 132" fill="none" stroke="#fdd835" stroke-width="12" stroke-linecap="round"/>' +
    '<path d="M94 85 Q50 97 14 139" fill="none" stroke="#f9a825" stroke-width="3" stroke-linecap="round"/>';
}
var SPEED = '<path d="M14 48 h24 M8 60 h22 M18 72 h22" stroke="#90a4ae" stroke-width="3" stroke-linecap="round"/>';

var SC = {
  outlet: function(){
    return svgWrap('<rect x="0" y="120" width="200" height="40" fill="#ffe0b2"/>' +
      '<rect x="74" y="22" width="70" height="88" rx="12" fill="#fff" stroke="#b0bec5" stroke-width="4"/>' +
      '<circle cx="97" cy="52" r="6" fill="#455a64"/><circle cx="121" cy="52" r="6" fill="#455a64"/>' +
      '<rect x="103" y="76" width="12" height="9" rx="3" fill="#455a64"/>' +
      '<text x="6" y="100" font-size="58">👉</text><text x="134" y="46" font-size="34">⚡</text>', '#fff3e0');
  },
  stairsQueue: function(){
    return svgWrap(stairsBase() + stand(24, 128, C2) + stand(66, 106, C3) + stand(110, 84, C4), '#e8f6ff');
  },
  stairsRush: function(){
    return svgWrap(stairsBase() +
      kid({c: C2, h: [48, 76], hip: [38, 112], la: [[36, 98], [28, 108]], ra: [[62, 92], [78, 84]], ll: [[32, 120], [28, 128]], rl: [[46, 120], [54, 128]]}) +
      kid({c: C3, h: [100, 56], hip: [86, 86], la: [[88, 62], [78, 50]], ra: [[110, 62], [120, 50]], ll: [[80, 96], [78, 106]], rl: [[92, 94], [98, 104]]}) +
      SPEED + '<text x="134" y="44" font-size="28">❗</text>', '#e8f6ff');
  },
  roadLook: function(){
    return svgWrap('<rect x="0" y="104" width="200" height="56" fill="#546e7a"/><rect x="0" y="92" width="200" height="14" fill="#cfd8dc"/>' +
      '<path d="M0 136 h200" stroke="#fff" stroke-width="3" stroke-dasharray="14 10"/>' +
      stand(56, 96, C2) + '<text x="70" y="34" font-size="26">👀</text><text x="112" y="144" font-size="40">🚗</text>', '#e3f6ff');
  },
  roadRun: function(){
    return svgWrap('<rect x="0" y="104" width="200" height="56" fill="#546e7a"/><rect x="0" y="92" width="200" height="14" fill="#cfd8dc"/>' +
      '<path d="M0 136 h200" stroke="#fff" stroke-width="3" stroke-dasharray="14 10"/>' +
      kid({c: C2, h: [78, 38], hip: [72, 70], la: [[66, 54], [56, 62]], ra: [[92, 52], [100, 44]], ll: [[62, 82], [52, 92]], rl: [[84, 80], [92, 92]]}) +
      '<path d="M10 46 h24 M4 58 h22 M14 70 h22" stroke="#90a4ae" stroke-width="3" stroke-linecap="round"/>' +
      '<text x="112" y="144" font-size="40">🚗</text><text x="132" y="66" font-size="28">❗</text>', '#e3f6ff');
  },
  poolAdult: function(){
    return svgWrap(waterLayer(112) + deckLayer(98, 14) +
      kid({c: C3, r: 13, lw: 7, bw: 10, h: [64, 22], hip: [64, 66], la: [[52, 52], [48, 66]], ra: [[80, 56], [104, 74]], ll: [[56, 82], [54, 98]], rl: [[72, 82], [74, 98]]}) +
      kid({c: C2, r: 9, lw: 5, bw: 7, h: [112, 56], hip: [112, 82], la: [[104, 74]], ra: [[120, 76], [122, 82]], ll: [[108, 90], [106, 98]], rl: [[116, 90], [118, 98]]}), '#e3f6ff');
  },
  poolFloat: function(){
    return svgWrap(kid({c: C2, r: 11, h: [100, 44], hip: [100, 96], la: [[86, 56], [76, 68]], ra: [[114, 56], [124, 68]], ll: [[96, 112]], rl: [[104, 112]]}) +
      waterLayer(84, .9) + '<circle cx="100" cy="88" r="20" fill="none" stroke="#ff7043" stroke-width="9"/>', '#e3f6ff');
  },
  poolWalk: function(){
    return svgWrap(waterLayer(112) + deckLayer(96, 16) + stand(86, 96, C2) + '<text x="124" y="94" font-size="30">🐢</text>', '#e3f6ff');
  },
  poolRun: function(){
    return svgWrap(waterLayer(112) + deckLayer(92, 20) +
      kid({c: C2, h: [100, 38], hip: [96, 70], la: [[86, 52], [78, 62]], ra: [[114, 48], [124, 38]], ll: [[86, 82], [72, 90]], rl: [[108, 80], [116, 92]]}) +
      SPEED + '<text x="140" y="60" font-size="28">❗</text>', '#e3f6ff');
  },
  poolPush: function(){
    return svgWrap(waterLayer(110) + '<rect x="140" y="92" width="60" height="30" fill="#4fc3f7"/>' + deckLayer(92, 20, 140) +
      kid({c: C2, h: [48, 38], hip: [44, 70], la: [[36, 58], [30, 70]], ra: [[66, 52], [88, 56]], ll: [[38, 80], [34, 92]], rl: [[52, 80], [58, 92]]}) +
      kid({c: C3, h: [112, 36], hip: [104, 68], la: [[100, 44], [92, 32]], ra: [[124, 44], [134, 34]], ll: [[98, 80], [96, 92]], rl: [[112, 80], [122, 90]]}) +
      '<circle cx="164" cy="86" r="4" fill="#4fc3f7"/><circle cx="176" cy="78" r="3" fill="#4fc3f7"/><text x="140" y="30" font-size="26">❗</text>', '#e3f6ff');
  },
  poolAlone: function(){
    return svgWrap(waterLayer(112) + deckLayer(94, 18) + stand(104, 94, C2) + '<text x="124" y="56" font-size="30">😟</text><text x="30" y="76" font-size="40">❓</text>', '#e3f6ff');
  },

function home(){
  S.mode = null; S.token++; S.wdone = true; stopSpeech();
  var h = '<div class="bar"><div class="chip">⭐ ' + S.total + '</div><div class="title">Bé Vui Học</div>' +
          '<button class="ib" onclick="toggleSound()">' + (S.sound ? '🔊' : '🔇') + '</button></div><div class="menu">';
  MODES.forEach(function(m){
    h += '<button class="mb' + (m.wide ? ' wide' : '') + '" style="background:' + m.c + '" onclick="openMode(\'' + m.id + '\')">' +
         '<span class="e">' + m.e + '</span><span class="t">' + m.t + '</span></button>';
  });
  h += '</div>';
  app.innerHTML = h;
}
function openMode(id){
  ctx(); sfx.tap();
  if (id === 'numbers') numMenu(); else if (id === 'english') enMenu(); else start(id);
}
function toggleSound(){
  S.sound = !S.sound; if (!S.sound) stopSpeech(); else sfx.tap();
  home();
}

function genLetters(){
  return shuffle(LETTERS).slice(0, 5).map(function(it){
    var pool = LETTERS.filter(function(x){
      if (x.l === it.l) return false;
      if ((it.l === 'C' && x.l === 'K') || (it.l === 'K' && x.l === 'C')) return false;
      return true;
    });
    var opts = shuffle([it].concat(shuffle(pool).slice(0, 2))).map(function(x){
      return {h: x.l + ' <small>' + x.l.toLowerCase() + '</small>', ok: x.l === it.l};
    });
    return {
      kind: 'g3',
      say: it.w + '. ' + it.w + ' bắt đầu bằng chữ gì?',
      visual: '<div class="bigemoji">' + it.e + '</div><div class="cap"><b>' + it.w + '</b></div>',
      opts: opts,
      okSay: it.w + ' bắt đầu bằng chữ ' + it.s + '.'
    };
  });
}
function genCount(){

    var it = rnd(COUNT_ITEMS);
    var others = shuffle([1, 2, 3, 4, 5, 6].filter(function(x){ return x !== n; })).slice(0, 2);
    var opts = shuffle([n].concat(others)).map(function(x){ return {h: String(x), ok: x === n}; });

function enOptHtml(tp, it){

function enAsk(T, it, i){
  var w = it.w;

function genEnglish(tp){

    var oth = shuffle(near).slice(0, 2);
    if (oth.length < 2) {
      var rest = shuffle(all.filter(function(x){ return x !== n && oth.indexOf(x) < 0; }));
      oth = oth.concat(rest.slice(0, 2 - oth.length));
    }
    return {
      kind: 'g3',
      say: 'Số ' + NUM[n] + '. Con chọn nhóm có ' + NUM[n] + ' hình nào?',
      visual: '<div class="num-big">' + n + '</div><div class="cap">Số <b>' + NUM[n] + '</b></div>',
      opts: shuffle([n].concat(oth)).map(function(k){
        var g = ''; for (var j = 0; j < k; j++) g += '<span>' + e + '</span>';
        return {h: '<div class="grp">' + g + '</div>', ok: k === n};
      }),
      okSay: 'Đúng rồi! Số ' + NUM[n] + ' có ' + NUM[n] + ' hình.'
    };
  });
}

/* ---------- Vòng chơi ---------- */
function start(id){
  ctx(); sfx.tap();
  S.mode = id; S.round = 0; S.stars = 0; S.token++;
  var g = (id.indexOf('en-') === 0) ? function(){ return genEnglish(id.slice(3)); } : {letters: genLetters, count: genCount, rules: genRules, numrec: genNumRec}[id];
  S.list = g();
  nextQ();
}
function nextQ(){
  if (S.round >= S.list.length) return finish();
  var q = S.list[S.round];
  S.q = q; S.wrong = 0; S.locked = false; S.counted = 0;
  var dots = '';
  for (var r = 0; r < S.list.length; r++) dots += '<span class="d' + (r < S.round ? ' done' : (r === S.round ? ' cur' : '')) + '"></span>';
  var opts = '';
  q.opts.forEach(function(o, i){
    opts += '<button class="opt ' + (o.cls || '') + '" onclick="pick(' + i + ')">' + o.h + '</button>';
  });
  var back = backCall();
  app.innerHTML =
    '<div class="top"><button class="ib" onclick="' + back + '">' + (back === 'home()' ? '🏠' : '⬅️') + '</button><div class="dots">' + dots + '</div>' +
    '<button class="ib" onclick="replay()">🔊</button></div>' +
    '<div class="stage">' + q.visual + '</div>' +
    '<div class="opts ' + q.kind + '">' + opts + '</div>';
  var tk = S.token;
  setTimeout(function(){ if (tk === S.token && S.q === q && !S.locked) qSpeak(q); }, 250);
}
function replay(){
  if (S.locked || !S.q) return;
  sfx.tap(); qSpeak(S.q);
}
function cnt(el){
  if (S.locked || el.getAttribute('data-d')) return;
  el.setAttribute('data-d', '1');
  S.counted++;
  el.classList.add('counted');
  el.insertAdjacentHTML('beforeend', '<b>' + S.counted + '</b>');
  sfx.tap();
  say(NUM[S.counted] || String(S.counted));
}
function pick(i){
  if (S.locked) return;
  ctx();
  var q = S.q, o = q.opts[i];
  var el = document.querySelectorAll('.opt')[i];
  if (o.ok) {
    S.locked = true; S.stars++;
    el.classList.add('right');
    sfx.good(); confetti(14);
    var tk = S.token;
    sayThen(q.okList ? q.okList : (rnd(PRAISE) + ' ' + q.okSay), function(){
      if (tk !== S.token) return;
      S.round++; nextQ();
    });
  } else {
    S.wrong++;
    sfx.bad();
    el.classList.add('shake');
    setTimeout(function(){ el.classList.remove('shake'); el.classList.add('dim'); }, 420);
    if (q.en) say([{t: 'Oops! Try again!', l: 'en'}]); else say('Chưa đúng. Con thử lại nhé!');
    if (S.wrong >= 2) {
      var btns = document.querySelectorAll('.opt');
      q.opts.forEach(function(x, k){ if (x.ok) btns[k].classList.add('hint'); });
    }
  }
}
function backCall(){
  if (S.mode === 'numrec') return 'numMenu()';
  if (S.mode && S.mode.indexOf('en-') === 0) return "enTopic('" + S.mode.slice(3) + "')";
  return 'home()';
}
function finish(){
  S.total += S.stars; S.q = null; S.locked = true;
  var stars = '';
  for (var i = 0; i < S.list.length; i++) stars += i < S.stars ? '⭐' : '☆';
  var isEn = S.mode && S.mode.indexOf('en-') === 0;
  var back = backCall();
  var backBtn = '<button class="cta" style="background:#ff7043" onclick="' + back + '">' + (back === 'home()' ? '🏠' : '⬅️') + '</button>';
  app.innerHTML =
    '<div class="end">' +
      '<div class="big">🏆</div>' +
      '<div class="title">' + (isEn ? 'Great job!' : 'Giỏi quá!') + '</div>' +
      '<div class="stars">' + stars + '</div>' +
      '<div class="row">' +
        '<button class="cta" style="background:#43a047" onclick="start(\'' + S.mode + '\')">🔁</button>' + backBtn +
      '</div>' +
    '</div>';
  sfx.win(); confetti(40);
  setTimeout(function(){ if (isEn) say([{t: 'Great job! You got ' + S.stars + ' stars!', l: 'en'}]); else say('Giỏi quá! Con được ' + S.stars + ' ngôi sao!'); }, 900);
}

/* ---------- Đố số: menu, tập viết số ---------- */
function numMenu(){
  S.mode = null; S.token++; S.wdone = true; stopSpeech();
  app.innerHTML =
    '<div class="bar"><button class="ib" onclick="home()">🏠</button><div class="title">Đố số</div><span style="width:56px"></span></div>' +
    '<div class="menu" style="grid-template-columns:1fr">' +
      '<button class="mb" style="background:#26a69a" onclick="start(\'numrec\')"><span class="e">👀</span><span class="t">Nhận số</span></button>' +
      '<button class="mb" style="background:#7e57c2" onclick="writePick()"><span class="e">✍️</span><span class="t">Tập viết số</span></button>' +
    '</div>';
}
function writePick(){
  S.mode = null; S.token++; S.wdone = true; stopSpeech(); sfx.tap();
  var cols = ['#ff7043', '#29b6f6', '#ab47bc', '#43a047', '#f9a825'];
  var g = '';
  for (var i = 1; i <= 10; i++) g += '<button class="nb" style="color:' + cols[(i - 1) % 5] + '" onclick="writeStart(' + i + ')">' + i + '</button>';
  app.innerHTML =
    '<div class="bar"><button class="ib" onclick="numMenu()">⬅️</button><div class="title">Chọn số để viết</div><span style="width:56px"></span></div>' +
    '<div class="menu" style="grid-template-columns:repeat(5,1fr);gap:10px">' + g + '</div>';
}

function arc(cx, cy, rx, ry, a0, a1){
  var p = [], n = 26;
  for (var i = 0; i <= n; i++) {
    var a = (a0 + (a1 - a0) * i / n) * Math.PI / 180;
    p.push([cx + rx * Math.cos(a), cy + ry * Math.sin(a)]);
  }
  return p;
}
var STROKES = {
  1: [[[.36, .28], [.56, .10], [.56, .90]]],
  2: [arc(.5, .32, .25, .22, 190, 400).concat([[.26, .88], [.78, .88]])],
  3: [arc(.48, .30, .22, .20, 200, 450).concat(arc(.48, .68, .26, .22, 270, 520))],
  4: [[[.55, .10], [.22, .62], [.80, .62]], [[.66, .10], [.66, .90]]],
  5: [[[.74, .12], [.33, .12], [.33, .46]].concat(arc(.5, .64, .26, .24, 230, 520))],
  6: [[[.68, .12], [.46, .20], [.30, .42], [.26, .66]].concat(arc(.5, .68, .24, .22, 180, -180))],
  7: [[[.24, .12], [.76, .12], [.40, .90]]],
  8: [arc(.5, .30, .2, .18, -60, -270).concat(arc(.5, .68, .25, .22, -90, 270))],
  9: [arc(.5, .32, .24, .21, 0, -360).concat([[.74, .32], [.70, .62], [.5, .88], [.34, .82]])],
  10: [[[.12, .30], [.22, .14], [.22, .88]], arc(.62, .5, .17, .36, -90, -450)]
};
var CW = 400, PAD = 40, SZ = 320;
var need = [], got = 0;
function px(p){ return [PAD + p[0] * SZ, PAD + p[1] * SZ]; }

function writeStart(n){
  S.mode = 'write'; S.wn = n; S.token++; S.wdone = false;
  app.innerHTML =
    '<div class="top"><button class="ib" onclick="writePick()">⬅️</button><div class="chip" style="font-size:30px">Số ' + n + '</div><button class="ib" onclick="wReplay()">🔊</button></div>' +
    '<div class="stage"><div class="wrap"><canvas id="cg" width="400" height="400"></canvas><canvas id="cd" width="400" height="400"></canvas></div></div>' +
    '<div class="row" id="wbtns"><button class="cta" style="background:#29b6f6" onclick="wClear()">🧽</button></div>';
  drawGuide(n);
  initDraw();
  var tk = S.token;
  setTimeout(function(){ if (tk === S.token && !S.wdone) say('Con hãy tô theo nét số ' + NUM[n] + ', bắt đầu từ chấm xanh nhé.'); }, 300);
}
function wReplay(){
  if (S.mode !== 'write') return;
  sfx.tap(); say('Con hãy tô theo nét số ' + NUM[S.wn] + ', bắt đầu từ chấm xanh nhé.');
}
function drawGuide(n){
  var c = document.getElementById('cg').getContext('2d');
  c.clearRect(0, 0, CW, CW);
  c.lineCap = 'round'; c.lineJoin = 'round';
  var st = STROKES[n];
  function path(s){
    c.beginPath();
    s.forEach(function(p, i){ var q = px(p); if (i === 0) c.moveTo(q[0], q[1]); else c.lineTo(q[0], q[1]); });
  }
  c.strokeStyle = '#efe6d2'; c.lineWidth = 46;
  st.forEach(function(s){ path(s); c.stroke(); });
  c.strokeStyle = '#cbbf9f'; c.lineWidth = 4; c.setLineDash([2, 12]);
  st.forEach(function(s){ path(s); c.stroke(); });
  c.setLineDash([]);
  st.forEach(function(s, i){
    var a = px(s[0]), b = px(s[Math.min(3, s.length - 1)]);
    var ang = Math.atan2(b[1] - a[1], b[0] - a[0]);
    c.fillStyle = '#43a047';
    c.save(); c.translate(a[0] + Math.cos(ang) * 32, a[1] + Math.sin(ang) * 32); c.rotate(ang);
    c.beginPath(); c.moveTo(12, 0); c.lineTo(-8, -10); c.lineTo(-8, 10); c.closePath(); c.fill(); c.restore();
    c.beginPath(); c.arc(a[0], a[1], 14, 0, Math.PI * 2); c.fill();
    if (st.length > 1) {
      c.fillStyle = '#fff'; c.font = 'bold 20px sans-serif'; c.textAlign = 'center'; c.textBaseline = 'middle';
      c.fillText(String(i + 1), a[0], a[1] + 1);
    }
  });
}
function initDraw(){
  need = []; got = 0;
  STROKES[S.wn].forEach(function(s){
    var pts = s.map(px);
    for (var i = 0; i < pts.length - 1; i++) {
      var a = pts[i], b = pts[i + 1];
      var d = Math.sqrt((b[0] - a[0]) * (b[0] - a[0]) + (b[1] - a[1]) * (b[1] - a[1]));
      var k = Math.max(1, Math.round(d / 8));
      for (var j = 0; j < k; j++) need.push({x: a[0] + (b[0] - a[0]) * j / k, y: a[1] + (b[1] - a[1]) * j / k, c: false});
    }
  });
  var cv = document.getElementById('cd'), c = cv.getContext('2d'), last = null, down = false;
  function pos(e){
    var r = cv.getBoundingClientRect();
    return [(e.clientX - r.left) * CW / r.width, (e.clientY - r.top) * CW / r.height];
  }
  function mark(x, y){
    for (var i = 0; i < need.length; i++) {
      var p = need[i];
      if (!p.c && (p.x - x) * (p.x - x) + (p.y - y) * (p.y - y) < 900) { p.c = true; got++; }
    }
  }
  function seg(a, b){
    var d = Math.sqrt((b[0] - a[0]) * (b[0] - a[0]) + (b[1] - a[1]) * (b[1] - a[1]));
    var k = Math.max(1, Math.ceil(d / 6));
    for (var j = 1; j <= k; j++) mark(a[0] + (b[0] - a[0]) * j / k, a[1] + (b[1] - a[1]) * j / k);
  }
  cv.onpointerdown = function(e){
    if (S.wdone) return;
    e.preventDefault(); ctx();
    down = true; last = pos(e);
    try { cv.setPointerCapture(e.pointerId); } catch (x) {}
    c.fillStyle = '#ff7043'; c.beginPath(); c.arc(last[0], last[1], 13, 0, Math.PI * 2); c.fill();
    mark(last[0], last[1]);
  };
  cv.onpointermove = function(e){
    if (!down || S.wdone) return;
    e.preventDefault();
    var p = pos(e);
    c.strokeStyle = '#ff7043'; c.lineWidth = 26; c.lineCap = 'round';
    c.beginPath(); c.moveTo(last[0], last[1]); c.lineTo(p[0], p[1]); c.stroke();
    seg(last, p); last = p;
    wCheck();
  };
  cv.onpointerup = cv.onpointercancel = function(){ down = false; wCheck(); };
}
function wCheck(){
  if (S.wdone || !need.length) return;
  if (got / need.length >= 0.85) {
    S.wdone = true; S.total++;
    var n = S.wn;
    sfx.good(); confetti(26);
    var b = document.getElementById('wbtns');
    if (b) b.innerHTML =
      (n < 10 ? '<button class="cta" style="background:#43a047" onclick="writeStart(' + (n + 1) + ')">➡️</button>' : '') +
      '<button class="cta" style="background:#29b6f6" onclick="writeStart(' + n + ')">🔁</button>' +
      '<button class="cta" style="background:#ff7043" onclick="writePick()">🏠</button>';
    setTimeout(function(){ say(rnd(PRAISE) + ' Con viết số ' + NUM[n] + ' thật đẹp!'); }, 500);
  }
}
function wClear(){
  if (S.mode !== 'write') return;
  sfx.tap();
  var cv = document.getElementById('cd');
  cv.getContext('2d').clearRect(0, 0, CW, CW);
  need.forEach(function(p){ p.c = false; });
  got = 0; S.wdone = false;
}

/* ---------- English: menu, học (Learn) ---------- */
function toggleVi(){ S.vi = !S.vi; sfx.tap(); enMenu(); }
function enMenu(){
  S.mode = null; S.token++; S.wdone = true; stopSpeech();
  var h = '<div class="bar"><button class="ib" onclick="home()">🏠</button><div class="title">English</div><span style="width:56px"></span></div><div class="menu" style="grid-template-columns:1fr 1fr;gap:10px;align-content:start">';
  Object.keys(EN).forEach(function(k){
    var T = EN[k];
    h += '<button class="mb" style="background:' + T.c + ';min-height:clamp(96px,14vh,130px)" onclick="enTopic(\'' + k + '\')"><span class="e" style="font-size:clamp(40px,12vw,60px)">' + T.e + '</span><span class="t" style="font-size:clamp(18px,5vw,24px)">' + T.title + '</span></button>';
  });
  h += '</div><div class="row" style="min-height:0"><button class="chip" style="font-size:20px" onclick="toggleVi()">Đọc thêm nghĩa tiếng Việt: ' + (S.vi ? 'Bật' : 'Tắt') + '</button></div>';
  app.innerHTML = h;
}
function enTopic(tp){
  var T = EN[tp];
  S.mode = null; S.token++; S.wdone = true; stopSpeech();
  app.innerHTML =
    '<div class="bar"><button class="ib" onclick="enMenu()">⬅️</button><div class="title">' + T.title + '</div><span style="width:56px"></span></div>' +
    '<div class="menu" style="grid-template-columns:1fr">' +
      '<button class="mb" style="background:#29b6f6" onclick="enLearn(\'' + tp + '\',0)"><span class="e">👆</span><span class="t">Learn</span></button>' +
      '<button class="mb" style="background:#ff7043" onclick="ctx();start(\'en-' + tp + '\')"><span class="e">🎯</span><span class="t">Play</span></button>' +
    '</div>';
}
function enSpeak(tp, i){ sfx.tap(); say(enSayList(tp, EN[tp].items[i], true)); }
function enLearn(tp, i){
  ctx(); sfx.tap();
  S.mode = 'enlearn'; S.token++; S.q = null; S.locked = true;
  var T = EN[tp], it = T.items[i], n = T.items.length;
  var vis = enVis(tp, it);
  var prev = i > 0
    ? '<button class="cta" style="background:#29b6f6" onclick="enLearn(\'' + tp + '\',' + (i - 1) + ')">◀️</button>'
    : '<span style="width:120px"></span>';
  var next = '<button class="cta" style="background:#43a047" onclick="' +
    (i < n - 1 ? 'enLearn(\'' + tp + '\',' + (i + 1) + ')' : 'enLearnDone(\'' + tp + '\')') + '">▶️</button>';
  app.innerHTML =
    '<div class="top"><button class="ib" onclick="enTopic(\'' + tp + '\')">⬅️</button><div class="chip">' + (i + 1) + ' / ' + n + '</div>' +
    '<button class="ib" onclick="enSpeak(\'' + tp + '\',' + i + ')">🔊</button></div>' +
    '<div class="stage" onclick="enSpeak(\'' + tp + '\',' + i + ')">' + vis + '<div class="enword"' + (it.w.length > 8 ? ' style="font-size:clamp(40px,12vw,70px)"' : '') + '>' + it.w + '</div></div>' +
    '<div class="row">' + prev + next + '</div>';
  var tk = S.token;
  setTimeout(function(){ if (tk === S.token) say(enSayList(tp, it, true)); }, 250);
}
function enLearnDone(tp){
  S.total++; sfx.win(); confetti(30);
  enTopic(tp);
  setTimeout(function(){ say([{t: 'Well done!', l: 'en'}]); }, 300);
}

splash();
</script>
